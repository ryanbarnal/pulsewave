<!doctype html><html><head><meta charset="utf-8"><title>Minimal logos</title><style>body{margin:0;background:#fafafa;color:#111;font-family:system-ui;padding:28px 16px}h1{text-align:center;font-weight:600;font-size:22px;margin:0 0 22px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;max-width:980px;margin:auto}figure{margin:0;text-align:center}figure img{width:100%;border-radius:22%}figcaption{margin-top:10px;font-size:14px}figcaption span{color:#777}.row{display:flex;gap:18px;justify-content:center;margin-top:26px;padding:18px;background:#111;border-radius:16px;max-width:520px;margin-left:auto;margin-right:auto}.sm{width:44px;border-radius:22%;outline:1px solid #333}</style></head><body><h1>Thin minimal black &amp; white logo</h1><div class="g"><figure><img src="logo-a.svg"><figcaption><b>A · Play + Bars</b><br><span>closest to your current logo</span></figcaption></figure><figure><img src="logo-b.svg"><figcaption><b>B · Pulse</b><br><span>one line</span></figcaption></figure><figure><img src="logo-c.svg"><figcaption><b>C · Disc</b><br><span>record</span></figcaption></figure><figure><img src="logo-d.svg"><figcaption><b>D · Wave</b><br><span>sound bars</span></figcaption></figure></div><div class="row"><img class="sm" src="logo-a.svg"><img class="sm" src="logo-b.svg"><img class="sm" src="logo-c.svg"><img class="sm" src="logo-d.svg"></div></body></html>
