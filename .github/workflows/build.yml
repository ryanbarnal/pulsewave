name: Build installers
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
      - name: Build macOS installers
        if: runner.os == 'macOS'
        run: |
          npx electron-builder --mac dmg --arm64 --publish never
          npx electron-builder --mac dmg --x64 --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.v.outputs.tag }}
          name: Pulsewave ${{ github.ref_type == 'tag' && github.ref_name || steps.v.outputs.tag }}
          files: out/*
